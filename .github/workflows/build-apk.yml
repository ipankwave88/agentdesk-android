name: Build AgentDesk Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Generate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.5 || gradle wrapper
        chmod +x gradlew

    - name: Build APK with Gradle Wrapper
      run: |
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AgentDesk-v2-APK
        path: app/build/outputs/apk/debug/*.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.0.0
        name: AgentDesk v2.0.0 Native Shell
        body: |
          ### AgentDesk v2 — Tri-Agent Mobile ADE (Native Shell Edition)
          - Fullscreen terminal & IDE
          - Integrated Termius accessory keyboard
          - Multi-Agent fleet (Claude Code, OpenCode, Hermes)
          - Live server dynamic auto-update
        files: app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
