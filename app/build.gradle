apply plugin: 'com.android.application'

android {
    namespace 'com.arkenzi.agentdesk'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.arkenzi.agentdesk"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
